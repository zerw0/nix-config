name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    container:
      image: nixos/nix:2.33.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Enable flakes
        run: |
          mkdir -p /etc/nix
          echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
          echo "accept-flake-config = true" >> /etc/nix/nix.conf
      - name: Configure git auth for private flake inputs
        env:
          FORGEJO_SSH_KEY: ${{ secrets.NIX_PRIVATE_SSH_KEY }}
        run: |
          set -eu
          test -n "$FORGEJO_SSH_KEY" || { echo "::error::NIX_PRIVATE_SSH_KEY is missing"; exit 1; }
          command -v ssh
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$FORGEJO_SSH_KEY" > "$HOME/.ssh/forgejo-flake"
          install -m 644 .forgejo/ssh_known_hosts "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host git.zerw.xyz
            User git
            IdentityFile $HOME/.ssh/forgejo-flake
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          git ls-remote ssh://git@git.zerw.xyz/hdjenkov/nix-private.git HEAD > /dev/null

      - name: Format check (treefmt)
        run: |
          nix --extra-experimental-features 'nix-command flakes' fmt
          if ! git diff --exit-code; then
            echo "::error::treefmt produced changes. Run 'nix fmt' locally and commit."
            exit 1
          fi

      - name: Evaluate all configurations
        run: nix --extra-experimental-features 'nix-command flakes' flake check --no-build --all-systems --no-write-lock-file

      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/forgejo-flake" "$HOME/.ssh/config"
